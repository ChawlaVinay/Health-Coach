<div class="c"><h2>My Foods</h2>${S.my.map((f,i)=>`<div class="row" style="justify-content:space-between"><span>${f.n} <span class="mu">${f.u}</span></span><button class="chip" onclick="S.my.splice(${i},1);save();R()">Remove</button></div>`).join('')||'<div class="mu">Save foods from the manual entry on Today.</div>'}</div>`}
const V={today:vT,train:vR,week:vW,me:vM};
function R(){$('v').innerHTML=((sp&&!usr)?vL():V[tab]())+'<div class="mu" id="sy" style="text-align:center;margin-top:8px"></div>';ss();$('n').innerHTML=(sp&&!usr)?'':[['today','Today'],['train','Training'],['week','Week'],['me','Me']].map(x=>`<button class="${tab==x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}
const go=t=>{tab=t;scrollTo(0,0);R()},wt=i=>{const d=D();d.water=d.water==i+1?i:i+1;save();R()},sv=(k,v)=>{D()[k]=+v;save();R()},tl=l=>{const a=D().loc,i=a.indexOf(l);i<0?a.push(l):a.splice(i,1);save();R()},dm=i=>{D().meals.splice(i,1);save();R()},sg=(k,v)=>{S.g[k]=v;save();R()},sb=(k,v)=>{S.b[k]=v;save();R()};
function fs(q){q=q.trim().toLowerCase();res=q?S.my.map(f=>({...f,s:1})).concat(FD).filter(f=>f.n.toLowerCase().includes(q)).slice(0,8):[];$('res').innerHTML=res.map((f,i)=>`<div onclick="pk(${i})">${f.s?'★ ':''}${f.n} <span class="mu">${f.u}: P${f.p} C${f.c} F${f.f} Fb${f.fb}</span></div>`).join('')||(q?'<div class="mu">Not in the list. Use manual entry below.</div>':'')}
function pk(i){sel=res[i];$('sel').textContent='Selected: '+sel.n+' ('+sel.u+'). Set how many portions below.';$('res').innerHTML=''}
function addF(){if(!sel){$('sel').textContent='Search and pick a food first.';return}const q=+$('q').value||1;D().meals.push({cat:$('cat').value,n:sel.n,q,p:sel.p*q,c:sel.c*q,f:sel.f*q,fb:sel.fb*q});sel=null;save();R()}
function man(){const n=$('mn').value.trim();if(!n)return;const f={n,u:'1 serving',p:+$('mp').value||0,c:+$('mc').value||0,f:+$('mf').value||0,fb:+$('mb').value||0};if($('ms').checked&&!S.my.some(x=>x.n==n))S.my.push(f);sel=f;addF()}
function al(){const e=$('le').value.trim();if(!e)return;S.lifts.push({d:dk(0),e,w:+$('lw').value||0,r:+$('lr').value||0});save();R()}
function ai(){const w=+$('iw').value,bf=+$('ib').value;if(!w||!bf)return;S.inb.push({d:$('id').value,w,bf,smm:+$('is').value||0});S.inb.sort((x,y)=>x.d<y.d?-1:1);S.b.w=w;save();R()}
const kg=(k,v)=>{(S.kg=S.kg||{})[k]=v;save()};
const gdt=i=>{const a=S.gd,j=a.indexOf(i);j<0?a.push(i):a.splice(j,1);save();R()},dsa=()=>{const n=$('dn').value.trim(),a=$('da').value,b=$('db').value;if(!n||!a||!b)return;S.dis.push({n,a,b});save();R()};
function rm(){const L=S.inb[S.inb.length-1],g=S.g;if(!L)return'';const ws=[];let d=new Date();d.setHours(0,0,0,0);const end=new Date(g.dl);while(d<end&&ws.length<30){const e=new Date(d);e.setDate(e.getDate()+6);const ds=S.dis.find(x=>x.a&&x.b&&new Date(x.a)<=e&&new Date(x.b)>=d);ws.push({s:new Date(d),ds});d.setDate(d.getDate()+7)}const st=(L.bf-g.bf)/(ws.filter(w=>!w.ds).length||1);let bf=L.bf;return ws.map((w,i)=>{if(!w.ds)bf-=st;return`<tr><td>${i+1}</td><td>${w.s.getDate()}/${w.s.getMonth()+1}</td><td>${w.ds?'Maintain: '+w.ds.n:'Push'}</td><td>${r1(bf)}%</td></tr>`}).join('')}
async function off(){const q=$('q0').value.trim();if(q.length<3)return;$('res').innerHTML='<div class="mu">Searching...</div>';try{const r=await fetch('https://world.openfoodfacts.org/cgi/search.pl?search_simple=1&action=process&json=1&page_size=6&fields=product_name,nutriments&search_terms='+encodeURIComponent(q)),j=await r.json();res=(j.products||[]).filter(p=>p.product_name&&p.nutriments).map(p=>({n:p.product_name+' (Open Food Facts)',u:'100 g',p:r1(+p.nutriments.proteins_100g||0),c:r1(+p.nutriments.carbohydrates_100g||0),f:r1(+p.nutriments.fat_100g||0),fb:r1(+p.nutriments.fiber_100g||0)}));$('res').innerHTML=res.map((f,i)=>`<div onclick="pk(${i})">${f.n} <span class="mu">per 100 g: P${f.p} C${f.c} F${f.f} Fb${f.fb}</span></div>`).join('')||'<div class="mu">No results.</div>'}catch(e){$('res').innerHTML='<div class="mu">Online search failed. Use manual entry.</div>'}}
function ics(){const z=dk(0).replace(/-/g,''),ev=(n,r)=>['BEGIN:VEVENT','UID:'+n.replace(/ /g,'')+'@hc','DTSTAMP:'+z+'T000000Z','DTSTART:'+z+'T070000','RRULE:'+r,'SUMMARY:'+n,'END:VEVENT'],t=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//HealthCoach//EN',...ev('Morning check-in','FREQ=DAILY'),...ev('InBody scan and progress photos','FREQ=WEEKLY;BYDAY=SU'),'END:VCALENDAR'],a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t.join('\r\n')],{type:'text/calendar'}));a.download='health-coach-reminders.ics';a.click()}
const vL=()=>`<div class="c"><h2>Sign in</h2><div class="row"><input id="ae" type="email" placeholder="Email" style="width:100%"><input id="ap" type="password" placeholder="Password" style="width:100%"><button class="p" onclick="au('in')">Sign in</button><button onclick="au('up')">Create account</button></div><p id="am" class="mu"></p></div>`;
async function au(m){const e=$('ae').value,p=$('ap').value,r=m=='in'?await sp.auth.signInWithPassword({email:e,password:p}):await sp.auth.signUp({email:e,password:p});if(r.error){$('am').textContent=r.error.message;return}if(!r.data.session){$('am').textContent='Check your email to confirm, then sign in.';return}init()}
async function init(){ens();if(!sp){R();return}const{data:{session}}=await sp.auth.getSession();if(!session){usr=null;R();return}usr=session.user;const{data}=await sp.from('state').select('data').eq('user_id',usr.id).maybeSingle();if(data&&data.data){S=data.data;ens();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}else push();R();wh()}
const ss=()=>{const e=$('sy');if(e)e.textContent=sp?(usr?syn||'Signed in':'Not signed in'):'Local only'};
async function pull(){if(!sp||!usr||dirty)return;const a=document.activeElement;if(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))return;const{data,error}=await sp.from('state').select('data').eq('user_id',usr.id).maybeSingle();if(error){syn='Sync error: '+error.message;ss();return}if(data&&data.data&&JSON.stringify(data.data)!==JSON.stringify(S)){S=data.data;ens();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}R()}syn='Synced '+new Date().toLocaleTimeString();ss()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){pull();wh()}});setInterval(wh,9e5);setInterval(pull,15000);
const wcard=()=>{let b;if(!sp||!usr)b='<p class="mu" style="margin:0">Sign in to use Whoop.</p>';else if(!W)b='<p class="mu" style="margin:0">Loading Whoop data...</p>';else if(W.error)b='<p class="w" style="margin:0">'+W.error+'</p>';else if(!W.connected)b='<p class="mu" style="margin:0 0 8px">Not connected.</p><button class="p" onclick="wc()">Connect Whoop</button>';else{const L=W.latest,f=(v,u='')=>v==null?'-':v+u;b='<div class="row" style="justify-content:space-between;text-align:center">'+[['Recovery',f(L.rec,'%')],['HRV',f(L.hrv,' ms')],['Resting HR',f(L.rhr)],['Sleep',f(L.sleepH,' h')],['Strain',f(L.strain)]].map(x=>'<div><div style="font-size:18px;font-weight:700">'+x[1]+'</div><div class="mu">'+x[0]+'</div></div>').join('')+'</div>'}return'<div class="c"><h2>Whoop</h2>'+b+'</div>'};
